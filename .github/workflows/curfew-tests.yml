name: curfew-youth-violence tests

on:
  push:
    branches: ["**"]
    paths:
      - "curfew_youth_violence/**"
      - ".github/workflows/curfew-tests.yml"
  pull_request:
    paths:
      - "curfew_youth_violence/**"
      - ".github/workflows/curfew-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: curfew_youth_violence
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run validation & falsification tests
        run: pytest -q tests/

      - name: Smoke-test the simulation pipeline
        run: python run.py --simulate --n-boot 100
